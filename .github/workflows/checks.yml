name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: bash -n ru-ip-watchdog.sh install.sh cleanup.sh tests/test-shell.sh
      - run: bash tests/test-shell.sh
  powershell:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./tests/test-powershell.ps1
      - shell: powershell
        run: ./tests/test-windows-firewall.ps1
  macos-syntax:
    runs-on: macos-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: plutil -lint com.user.ru-ip-watchdog.plist
      - run: bash tests/test-pf-syntax.sh
